<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123c46"><title>2027 春节西葡旅行手册</title><style>:root{--ink:#163942;--muted:#61757b;--sea:#0b777b;--sand:#f6f0e5;--line:#dce6e3}*{box-sizing:border-box}body{margin:0;background:#f7f8f5;color:var(--ink);font-family:system-ui,-apple-system,'PingFang SC',sans-serif}header{background:linear-gradient(125deg,#103943,#147c7d);color:white;padding:35px max(22px,calc((100vw - 1050px)/2)) 42px}header small{letter-spacing:.22em;opacity:.8}h1{font-size:clamp(30px,5vw,55px);margin:12px 0}header p{max-width:650px;line-height:1.8;opacity:.88}.wrap{max-width:1050px;margin:auto;padding:22px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:-43px;position:relative}.stat,.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 30px #1639420a}.stat b{font-size:25px;display:block}.stat span,.sub{color:var(--muted);font-size:13px}.tabs{display:flex;gap:8px;overflow:auto;padding:24px 0 12px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:30px;padding:10px 16px;color:var(--ink);cursor:pointer}.tabs button.active{background:var(--ink);color:white}h2{font-size:23px}.lead{color:var(--muted);line-height:1.8}.dayhead{display:flex;justify-content:space-between;gap:15px;align-items:start}.pill{background:#e6f3ef;color:#14665e;padding:6px 10px;border-radius:18px;font-size:12px;white-space:nowrap}.timeline{border-left:2px solid #b4d4cf;margin:24px 0 15px 9px;padding-left:22px}.stop{position:relative;padding:0 0 23px}.stop:before{content:'';position:absolute;left:-30px;top:4px;background:#168583;border:4px solid #e1f2ed;width:10px;height:10px;border-radius:50%}.stop strong{display:block;font-size:16px}.stop small{color:var(--muted);display:block;margin-top:5px}.stop a,.links a{display:inline-block;margin-top:9px;color:#0a7377;text-decoration:none;font-size:13px}.notes{background:var(--sand);border-radius:12px;padding:15px;line-height:1.8;font-size:14px}.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:15px}.panel h3{margin-top:0}.route{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:15px 0}.route span{background:#eaf3f0;padding:8px 10px;border-radius:9px;font-size:12px}.route i{font-style:normal;color:#7c9692}.alert{background:#fff4db;border:1px solid #f4dcaa;padding:12px;border-radius:10px;font-size:13px;line-height:1.7}.links a{margin-right:15px}.footer{padding:25px 0;color:var(--muted);font-size:12px;line-height:1.8}@media(max-width:650px){.wrap{padding:15px}.stats{gap:7px}.stat{padding:14px}.stat b{font-size:20px}.cols{grid-template-columns:1fr}.dayhead{display:block}.pill{display:inline-block;margin-top:10px}}</style></head><body><header><small>PORTUGAL × SPAIN · TRAVEL JOURNAL</small><h1>2027 春节西葡之旅</h1><p>从里斯本的海风，到波尔图的杜罗河，再沿安达卢西亚走向马德里。把每天的路线、交通和待办放在同一份随身旅行手册里。</p><p>2027.02.07 — 02.16 · 北京返抵预计 02.17</p></header><main class="wrap"><section class="stats"><div class="stat"><b>10 天</b><span>行程日期</span></div><div class="stat"><b>2 国</b><span>葡萄牙 · 西班牙</span></div><div class="stat"><b>10 页</b><span>逐日行程</span></div></section><nav class="tabs" id="tabs" aria-label="选择日期"></nav><section id="content" aria-live="polite"></section><div class="footer">第一版 · 依据用户上传的 11 页行程 PDF 整理，2/8 波尔图与 2/10 里斯本采用后续确认的景点取舍。路线地图为导航入口，不是已核实的道路轨迹；所有 2027 年交通时刻、开放时间和票价均需临行前复核。本站不上传或保存订单号与个人证件信息。</div></main><script src="trip-data.js"></script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const map=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);let selected=0;const tabs=document.getElementById('tabs'),content=document.getElementById('content');function render(){tabs.innerHTML=trip.days.map((d,i)=>`<button class="${i===selected?'active':''}" data-day="${i}" aria-pressed="${i===selected}">${esc(d.date)} ${esc(d.city)}</button>`).join('');let d=trip.days[selected];content.innerHTML=`<div class="panel"><div class="dayhead"><div><div class="sub">DAY ${String(selected+1).padStart(2,'0')} · ${esc(d.weekday)}</div><h2>${esc(d.title)}</h2><div class="lead">${esc(d.summary)}</div></div><span class="pill">${esc(d.tag)}</span></div><div class="route">${d.stops.map((s,i)=>`${i?'<i>→</i>':''}<span>${esc(s.name)}</span>`).join('')}</div><div class="cols"><section><h3>每日路线 · Timeline</h3><div class="timeline">${d.stops.map(s=>`<div class="stop"><strong>${esc(s.name)}</strong><small>${esc(s.local||'')} ${s.time?'· '+esc(s.time):''}</small>${s.detail?`<small>${esc(s.detail)}</small>`:''}${s.query?`<a href="${map(s.query)}" target="_blank" rel="noopener noreferrer">打开地图导航 ↗</a>`:''}</div>`).join('')}</div></section><aside><div class="notes"><h3>当天提醒</h3>${esc(d.note)}</div><h3 style="margin-top:22px">交通与住宿</h3><p class="lead">${esc(d.transport)}</p><p class="lead">${esc(d.stay)}</p><div class="alert">${esc(d.status)}</div><div class="links"><a href="${map(d.city+', Portugal Spain')}" target="_blank" rel="noopener noreferrer">城市地图 ↗</a></div></aside></div></div>`;tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=+b.dataset.day;render();window.scrollTo({top:180,behavior:'smooth'})})}render()</script></body></html>
